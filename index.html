<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Prompt Library</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<div class="container">
			<header>
				<h1>📚 Prompt Library</h1>
				<p class="subtitle">Save and organize your favorite prompts</p>
			</header>

			<main>
				<section class="form-section">
					<h2>Create New Prompt</h2>
					<form id="promptForm">
						<div class="form-group">
							<label for="promptTitle">Prompt Title</label>
							<input
								type="text"
								id="promptTitle"
								placeholder="e.g., Code Review Template"
								required
							/>
						</div>
						<div class="form-group">
							<label for="promptModel">Model Name (Optional)</label>
							<input
								type="text"
								id="promptModel"
								placeholder="e.g., GPT-4, Claude 3.5 Sonnet, Llama 2"
								maxlength="100"
							/>
						</div>
						<div class="form-group">
							<label for="promptContent">Prompt Content</label>
							<textarea
								id="promptContent"
								placeholder="Enter your prompt here..."
								rows="6"
								required
							></textarea>
						</div>
						<button type="submit" class="btn btn-primary">Save Prompt</button>
					</form>
				</section>

				<section class="prompts-section">
					<h2>Saved Prompts (<span id="promptCount">0</span>)</h2>
					<div id="promptsContainer" class="prompts-grid">
						<p class="empty-state">
							No prompts yet. Create one to get started!
						</p>
					</div>
				</section>
			</main>

			<footer>
				<p>&copy; 2024 Prompt Library | Built with ❤️ for developers</p>
			</footer>
		</div>

		<!-- Notes Modal -->
		<div id="notesModal" class="modal">
			<div class="modal-content">
				<div class="modal-header">
					<h2 id="notesModalTitle">Notes</h2>
					<button type="button" class="modal-close" onclick="closeNotesModal()">
						&times;
					</button>
				</div>

				<div class="modal-body">
					<!-- Notes Editor -->
					<div class="notes-editor">
						<textarea
							id="noteInput"
							class="note-textarea"
							placeholder="Add your note here (max 500 characters)..."
							maxlength="500"
						></textarea>
						<div class="note-input-footer">
							<span id="charCount" class="char-counter">0 / 500</span>
							<div class="note-buttons">
								<button
									type="button"
									class="btn btn-secondary"
									onclick="closeNotesModal()"
								>
									Cancel
								</button>
								<button
									type="button"
									class="btn btn-primary"
									onclick="saveNote()"
								>
									Save Note
								</button>
							</div>
						</div>
					</div>

					<!-- Notes List -->
					<div id="notesList" class="notes-list">
						<p class="empty-notes">No notes yet</p>
					</div>
				</div>
			</div>
		</div>

		<script src="script.js"></script>
	</body>
</html>
